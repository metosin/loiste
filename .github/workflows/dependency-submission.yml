name: dependency-submission

# GitHub's dependency graph doesn't understand project.clj, so generate a
# pom.xml and submit the resolved Maven dependency tree. This lets Dependabot
# alerts cover the runtime dependencies (POI and its transitive deps).

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  submit:
    name: Submit dependencies

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Setup Java
      uses: actions/setup-java@v6
      with:
        distribution: zulu
        java-version: 21
    - name: Setup Clojure
      uses: DeLaGuardo/setup-clojure@13.7.0
      with:
        # 2.13.x tags on the GitHub mirror have a stale bin/lein (2.12.1-SNAPSHOT)
        lein: 2.12.0
    - name: Generate pom.xml
      # Without the dev profile, so only the deps library users get are submitted
      run: lein with-profile -user,-dev pom
    - name: Submit dependency snapshot
      uses: advanced-security/maven-dependency-submission-action@v6.0.1
